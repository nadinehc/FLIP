###
# generate_labels_ntk schema
# Produces poisoned labels by solving the bilevel problem (2) directly, replacing
# the inner training with NTK kernel regression (Appendix A). Drop-in replacement
# for generate_labels: outputs the poisoned labels, true labels, and losses as .npy files.
###

[generate_labels_ntk]
output_dir = "string. Path to output directory (slurm compatible)."
model = "string: {r32p, r18, r18_tin, vgg, vgg_pretrain, vit_pretrain}. Network whose empirical NTK is used."
dataset = "string: {cifar, cifar_100, tiny_imagenet}. For CIFAR-10, CIFAR-100 and Tiny Imagenet datasets."
source_label = "int: {-1,0,...,9}. Specifies label to mimic. -1 indicates all labels."
target_label = "int: {0,1,...,9}. Specifies label to attack."
poisoner = "string: Form: {{1,2,3,9}xp, {1,2}xs, {1,4}xl}. Integer resembles number of attacks and string represents type."

[OPTIONAL]
input_pth = "string. Model checkpoint .pth at which the NTK is computed (slurm compatible). Random init if omitted."
train_pct = "float: [0, 1]. Specifies percentage of dataset available to attacker. Set to 1 by default."
lambda = "float: [0, infty]. Specifies l1 regularization parameter. Set to 0 by default."
ntk_config = "dict. Specifies algorithm parameters. Set to default if ommited. See example_ntk."
