# FLIP with the GAN universal trigger (poisoner = "1xs").
# Same setup as example_attack (r32p, CIFAR-10, truck -> deer), only the trigger changes,
# so the numbers are directly comparable with the sinusoidal 1xs baseline.
# Requires noise_generator/universal_delta.npy (produced by universal_noise_gan.ipynb).

[train_expert]
output_dir = "out/checkpoints/r32p_1xs_baseline/0/"
model = "r32p"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
epochs = 20
checkpoint_iters = 50

[generate_labels]
input_pths = "out/checkpoints/r32p_1xs_baseline/{}/model_{}_{}.pth"
opt_pths = "out/checkpoints/r32p_1xs_baseline/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/sinusoidal_baseline/"
lambda = 0.0

[generate_labels.expert_config]
experts = 1
min = 0
max = 20

[generate_labels.attack_config]
iterations = 5
one_hot_temp = 5
alpha = 0
label_kwargs = {lr = 150, momentum = 0.5}

[select_flips]
budgets = [150, 300, 500, 1000, 1500]
input_label_glob = "experiments/sinusoidal_baseline/labels.npy"
true_labels = "experiments/sinusoidal_baseline/true.npy"
output_dir = "experiments/sinusoidal_baseline/"
