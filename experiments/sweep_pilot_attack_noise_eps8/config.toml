# Generated by sweep/run_sweep.py (tag=pilot).
# Edits here are overwritten on the next sweep run.

[generate_labels_noise]
input_pths = "out/sweep/pilot/checkpoints/{}/model_{}_{}.pth"
opt_pths = "out/sweep/pilot/checkpoints/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/sweep_pilot_attack_noise_eps8/"
lambda = 0.0
use_image_noise = true

[select_flips]
budgets = [ 1500,]
input_label_glob = "experiments/sweep_pilot_attack_noise_eps8/labels.npy"
true_labels = "experiments/sweep_pilot_attack_noise_eps8/true.npy"
output_dir = "experiments/sweep_pilot_attack_noise_eps8/"

[generate_labels_noise.expert_config]
experts = 4
min = 0
max = 15

[generate_labels_noise.attack_config]
iterations = 15
one_hot_temp = 5

[generate_labels_noise.noise_config]
epsilon_255 = 8
norm = "linf"
width = 32
lr = 0.001
warmup = 0
quantize = true

[generate_labels_noise.attack_config.label_kwargs]
lr = 150
momentum = 0.5
