[train_user]
input_labels = "experiments/cGAN_attack_1/500.npy"
output_dir = "experiments/cGAN_attack_1/user_500/{}/"
user_model = "r32p"
soft = false
alpha = 0
batch_size = 256
epochs = 200
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "unet_cifar_generator.pth"

[train_user.optim_kwargs]
lr = 0.1
momentum = 0.9
nesterov = true
weight_decay = 0.0002

[train_user.scheduler_kwargs]
milestones = [ 75, 150,]
gamma = 0.1
