[train_user]
input_labels = "experiments/steg_v2_resnet18_ens5/300.npy"
output_dir = "experiments/steg_v2_resnet18_ens5/user_300/{}/"
user_model = "r32p"
soft = false
alpha = 0
batch_size = 256
epochs = 75
