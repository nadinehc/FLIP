[train_expert]
output_dir = "out/checkpoints/steganography_attack/{}/"
model = "r32p"
batch_size = 256
epochs = 20
checkpoint_iters = 50
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "steganography"

[generate_labels]
input_pths = "out/checkpoints/steganography_attack/{}/model_{}_{}.pth"
opt_pths = "out/checkpoints/steganography_attack/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
output_dir = "experiments/steganography_attack/"
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "steganography"

[select_flips]
budgets = [ 150, 300, 500, 750, 1000, 1500,]
input_label_glob = "experiments/steganography_attack/labels.npy"
true_labels = "experiments/steganography_attack/true.npy"
output_dir = "experiments/steganography_attack/"

[train_expert.optim_kwargs]
lr = 0.1
momentum = 0.9
nesterov = true
weight_decay = 0.0002

[train_expert.scheduler_kwargs]
milestones = [ 75, 150,]
gamma = 0.1

[generate_labels.expert_config]
experts = 5
min = 0
max = 20

[generate_labels.attack_config]
iterations = 25
