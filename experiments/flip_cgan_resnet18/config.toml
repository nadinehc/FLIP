[train_expert]
output_dir = "out/checkpoints/flip_cgan_resnet18/{}/"
model = "r32p"
batch_size = 256
epochs = 20
checkpoint_iters = 50
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "cgan_resnet18"

[generate_labels]
input_pths = "out/checkpoints/flip_cgan_resnet18/{}/model_{}_{}.pth"
opt_pths = "out/checkpoints/flip_cgan_resnet18/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
output_dir = "experiments/flip_cgan_resnet18/"
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "cgan_resnet18"

[select_flips]
budgets = [ 300, 500, 1000, 1500,]
input_label_glob = "experiments/flip_cgan_resnet18/labels.npy"
true_labels = "experiments/flip_cgan_resnet18/true.npy"
output_dir = "experiments/flip_cgan_resnet18/"

[train_expert.optim_kwargs]
lr = 0.1
momentum = 0.9
nesterov = true
weight_decay = 0.0002

[train_expert.scheduler_kwargs]
milestones = [ 75, 150,]
gamma = 0.1

[generate_labels.expert_config]
experts = 5
min = 0
max = 20

[generate_labels.attack_config]
iterations = 25
