# This example generates poisoned labels for the sinusoidal (1xs) trigger
# by solving the bilevel problem (2) with NTK kernel regression as the inner
# solver (Appendix A), instead of trajectory matching. The labels are then
# FLIPped at the provided budgets exactly as in example_attack.

# Module to generate attack labels with the NTK.
[generate_labels_ntk]
model = "r32p"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/example_ntk/"
lambda = 0.0
# Optional: linearize around a (briefly) trained network instead of the random init,
# e.g. an expert checkpoint from train_expert.
# input_pth = "out/checkpoints/r32p_1xs/0/model_1_50.pth"

[generate_labels_ntk.ntk_config]
n_train = 4000      # size of the kernel training set whose labels are optimized
n_poison = 500      # triggered source images used as a proxy for PTA
n_val = 1000        # clean images used as a proxy for CTA
ridge = 1e-3        # ridge, relative to the mean diagonal of the kernel
sketch_dim = 16384  # dimension of the gradient sketch (0 for the exact NTK)
iterations = 500
lr = 0.1
one_hot_temp = 5
cta_weight = 1.0    # lambda in equation (2)

# Module to flip labels at the provided budgets.
[select_flips]
budgets = [150, 300, 500, 1000, 1500]
input_label_glob = "experiments/example_ntk/labels.npy"
true_labels = "experiments/example_ntk/true.npy"
output_dir = "experiments/example_ntk/"
