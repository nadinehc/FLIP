dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "1xu"
universal_trigger_path = "experiments/flip_c10_1xu/delta.npy"
tag = "1xu_b150_r0"
budget = 150
retrain = false
backend = "python"
filters = ["rcov", "pca", "kmeans"]