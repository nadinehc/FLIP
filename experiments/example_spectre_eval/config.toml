# Standalone full-SPECTRE evaluation on an existing FLIP user model.
# Point model_path / input_labels / true_labels at any finished user run.
# Does not require spectre_proxy during label generation.
#
#   python run_experiment.py example_spectre_eval

[eval_spectre]
model_path = "experiments/flip_c10_1xu/user_150/0/model.pth"
input_labels = "experiments/flip_c10_1xu/150.npy"
true_labels = "experiments/flip_c10_1xu/true.npy"
output_dir = "experiments/example_spectre_eval/"
