[train_expert]
output_dir = "out/checkpoints/r32p_1xs/0/"      # trailing slash is required
model = "r32p"
trainer = "sgd"
dataset = "cifar"
source_label = 9            # truck
target_label = 4            # deer
poisoner = "1xs"            # sinusoidal trigger
epochs = 20
checkpoint_iters = 50

[generate_labels]
input_pths = "out/checkpoints/r32p_1xs/{}/model_{}_{}.pth"
opt_pths   = "out/checkpoints/r32p_1xs/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
trainer = "sgd"
dataset = "cifar"
source_label = 9
target_label = 4
poisoner = "1xs"
output_dir = "experiments/flip_c10/"            # trailing slash is required
lambda = 0.0

[generate_labels.expert_config]
experts = 1
min = 0
max = 20

[generate_labels.attack_config]
iterations = 5
one_hot_temp = 5
labels_kwargs = {lr = 150, momentum = 0.5}

[select_flips]
budgets = [150, 300, 500, 1000, 1500]
input_label_glob = "experiments/flip_c10/labels.npy"
true_labels = "experiments/flip_c10/true.npy"
output_dir = "experiments/flip_c10/"

[train_user]
input_labels = "experiments/flip_c10/300.npy"
output_dir = "experiments/flip_c10/user_300/"
user_model = "r32p"
dataset = "cifar"
trainer = "sgd"
source_label = 9
target_label = 4
poisoner = "1xs"
soft = false          # train on the hard (argmax) labels
alpha = 0             # required, see below
epochs = 30
scheduler_kwargs = {milestones = [15, 25]}